services:
  # Bharat Panchyt FastAPI Backend Service on Render
  - type: web
    name: bharatpanchyt-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/seed.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./bharatpanchyt.db
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMS_API_KEY
        sync: false
